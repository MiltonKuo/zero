const $=id=>document.getElementById(id);
function badge(d){if(d==null)return'';let c='b-m',t=d+'天';if(d<0)return'';if(d<=14)c='b-s';return '<span class="badge '+c+'">剩 '+d+' 天</span>';}
function render(){
 const L=$('list');L.innerHTML='';
 DATA.forEach((r,i)=>{
  const noaw=r.noaw?'<div class="strip bad">✘ 無法決標：'+esc(r.noaw)+'</div>':'<div class="strip wait">⏳ 進行中（招標端・尚未決標）</div>';
  const kw=r.kw?' <span class="ktag" style="background:#6a3fb8">'+esc(r.kw)+'</span>':'';
  const lk=r.link?'<a class="lk" href="'+esc(r.link)+'" target="_blank">官方原頁 ↗</a>':'';
  const ct=[r.contact?('聯絡：'+esc(r.contact)):'' ,r.tel?esc(r.tel):'',r.email?esc(r.email):'',r.level?('級距：'+esc(r.level)):'' ].filter(x=>x).join(' · ');
  const card=document.createElement('div');card.className='card';
  card.dataset.type=r.type;card.dataset.amt=r.amtB;card.dataset.budget=r.budgetB;card.dataset.method=r.method;card.dataset.dl=r.dlB;
  card.dataset.text=(r.unit+' '+r.no+' '+r.title+' '+(r.contact||'')).toLowerCase();
  card.innerHTML='<div class="chead"><span class="jno">'+esc(r.no)+'</span><span class="un">'+esc(r.unit)+badge(r.days)+'</span>'
   +'<span class="ttl">'+esc(r.title)+kw+'</span>'+lk+'</div>'
   +'<div class="meta">'
   +'<div class="m"><span>受補助金額</span><b>'+esc(r.subsidy)+'</b></div>'
   +'<div class="m"><span>預算金額</span><b>'+esc(r.budget)+'</b></div>'
   +'<div class="m"><span>採購級距</span><b>'+esc(r.level||'—')+'</b></div>'
   +'<div class="m"><span>招標方式</span><b>'+esc(r.method)+'</b></div>'
   +'<div class="m"><span>截止投標</span><b>'+esc(r.dl)+'</b></div>'
   +'<div class="m"><span>開標時間</span><b>'+esc(r.open||'—')+'</b></div></div>'
   +noaw
   +(ct?'<div class="ct">'+esc(ct)+'</div>':'');
  L.appendChild(card);
 });
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function apply(){
 const t=$('f-type').value,a=$('f-amt').value,b=$('f-budget').value,m=$('f-method').value,d=$('f-dl').value,q=$('q').value.trim().toLowerCase();
 let n=0;
 document.querySelectorAll('#list .card').forEach(c=>{
  let ok=true;
  if(t&&c.dataset.type!==t)ok=false;
  if(a&&c.dataset.amt!==a)ok=false;
  if(b&&c.dataset.budget!==b)ok=false;
  if(m&&c.dataset.method!==m)ok=false;
  if(d&&c.dataset.dl!==d)ok=false;
  if(q&&c.dataset.text.indexOf(q)<0)ok=false;
  c.style.display=ok?'':'none';if(ok)n++;
 });
 $('cnt').textContent='顯示 '+n+' / '+DATA.length+' 筆';
}
function resetF(){$('f-type').value='';$('f-amt').value='';$('f-budget').value='';$('f-method').value='';$('f-dl').value='';$('q').value='';apply();}
['f-type','f-amt','f-budget','f-method','f-dl'].forEach(id=>$(id).onchange=apply);
$('q').oninput=apply;
render();apply();
</script>
